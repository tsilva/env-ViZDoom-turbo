[package]
name = "vizdoom-turbo"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native batched preprocessing for env-vizdoom-turbo"
repository = "https://github.com/tsilva/env-ViZDoom-turbo"
readme = "README.md"

[lib]
name = "_vizdoom_turbo"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = "0.29.0"
rayon = "1.12.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
