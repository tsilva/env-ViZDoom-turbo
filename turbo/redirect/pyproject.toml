[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "vizdoom-turbo"
version = "1.3.0.post27"
description = "Migration package for env-vizdoom-turbo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Tiago Silva" }]
dependencies = ["env-vizdoom-turbo==1.3.0.post27"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["env-vizdoom-turbo[dev]==1.3.0.post27"]

[project.urls]
Migration = "https://github.com/tsilva/env-ViZDoom-turbo"

[tool.setuptools]
packages = []

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
