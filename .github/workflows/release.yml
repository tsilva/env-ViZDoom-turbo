name: Release

on:
  push:
    tags:
      - "env-vizdoom-turbo-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install ViZDoom build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libsdl2-dev libopenal-dev

      - name: Install release environment
        working-directory: turbo
        run: uv sync --frozen --all-extras --group release

      - name: Resolve version
        id: version
        shell: bash
        working-directory: turbo
        run: |
          set -euo pipefail
          version="$(uv run python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#env-vizdoom-turbo-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release metadata
        working-directory: turbo
        run: |
          uv run python ../.codex/skills/build-release/scripts/release_build.py \
            check-version --version "${{ steps.version.outputs.version }}"
          uv run python scripts/redirect_release.py check-source \
            --version "${{ steps.version.outputs.version }}"

      - name: Check PyPI version is unused
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: turbo
        run: >-
          uv run python ../.codex/skills/build-release/scripts/release_build.py
          check-pypi --version "${{ steps.version.outputs.version }}"

      - name: Check migration package version is unused
        if: >-
          github.event_name == 'push' && github.ref_type == 'tag' &&
          steps.version.outputs.version == '1.3.0.post27'
        working-directory: turbo
        run: >-
          uv run python ../.codex/skills/build-release/scripts/release_build.py
          check-pypi --package vizdoom-turbo
          --version "${{ steps.version.outputs.version }}"

      - name: Run source checks
        working-directory: turbo
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          uv run pytest -q
          uv run ruff check .

  build:
    name: Build ${{ matrix.platform }} wheel
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Restore Cargo cache
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: turbo/target-release-${{ matrix.platform }}
          key: cargo-release-v3-${{ matrix.platform }}-cp314-${{ github.sha }}
          restore-keys: |
            cargo-release-v3-${{ matrix.platform }}-cp314-

      - name: Install macOS ViZDoom build dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: brew install boost sdl2 sdl3 openal-soft

      - name: Install Linux ViZDoom build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libsdl2-dev libopenal-dev

      - name: Install release environment
        working-directory: turbo
        run: uv sync --frozen --all-extras --group release

      - name: Build wheel
        working-directory: turbo
        run: >-
          uv run python ../.codex/skills/build-release/scripts/release_build.py
          build-platform
          --platform "${{ matrix.platform }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Smoke wheel
        working-directory: turbo
        run: >-
          uv run python ../.codex/skills/build-release/scripts/release_build.py
          smoke-wheel
          "wheelhouse-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}
          path: turbo/wheelhouse-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}/*.whl
          if-no-files-found: error

  final-check:
    name: Audit release distributions
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install ViZDoom build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libsdl2-dev libopenal-dev

      - name: Install release environment
        working-directory: turbo
        run: uv sync --frozen --all-extras --group release

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-v${{ needs.validate.outputs.version }}-*
          path: turbo/wheelhouse
          merge-multiple: true

      - name: Audit wheels
        shell: bash
        working-directory: turbo
        run: |
          set -euo pipefail
          mkdir -p dist
          cp wheelhouse/*.whl dist/
          uv run python ../.codex/skills/build-release/scripts/release_build.py \
            final-check --version "${{ needs.validate.outputs.version }}" \
            wheelhouse/*.whl
          uv run twine check dist/*

      - name: Organize primary distributions
        shell: bash
        working-directory: turbo
        run: |
          set -euo pipefail
          mkdir -p publish/primary
          mv dist/* publish/primary/

      - name: Build and audit migration distributions
        if: needs.validate.outputs.version == '1.3.0.post27'
        working-directory: turbo
        run: >-
          uv run python scripts/redirect_release.py
          build
          --version "${{ needs.validate.outputs.version }}"
          --out-dir publish/redirect

      - name: Upload audited distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: turbo/publish/**
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - final-check
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/env-vizdoom-turbo
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: turbo/publish

      - name: Publish primary package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: turbo/publish/primary

      - name: Publish migration package distributions to PyPI
        if: needs.validate.outputs.version == '1.3.0.post27'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: turbo/publish/redirect

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: turbo/publish

      - name: Flatten release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p turbo/release-assets
          find turbo/publish -type f -exec cp {} turbo/release-assets/ \;

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          turbo/release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
